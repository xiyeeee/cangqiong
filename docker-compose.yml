name: cangqiong

services:
  mysql:
    image: mysql:8.0
    container_name: cangqiong-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sky_take_out
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - cangqiong-mysql:/var/lib/mysql
      - ./sky.sql:/docker-entrypoint-initdb.d/01-sky.sql:ro
      - ./docker/mysql/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7
    container_name: cangqiong-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  cangqiong-mysql:
